services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prova_python}
      MYSQL_USER: ${MYSQL_USER:-prova_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prova_app_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-prova_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-prova_app_password}
      DB_NAME: ${MYSQL_DATABASE:-prova_python}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      TEACHER_USERNAME: ${TEACHER_USERNAME:-professor}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-troque-esta-senha}
      PORT: 4000
    expose:
      - "4000"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    profiles:
      - dev

volumes:
  mysql_data:
  frontend_dev_node_modules: